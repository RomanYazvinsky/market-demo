# Builds the prerendered static site and deploys it to GitHub Pages on every push to master.
# One-time setup: repo Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: wasm/go.mod
          cache-dependency-path: wasm/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Go tests
        run: pnpm test:go
      - name: Vitest (builds the Wasm first)
        run: pnpm test -- --run
      - name: Committed prebuilt Wasm matches the Go sources
        run: git diff --exit-code -- wasm/prebuilt
      - name: Build under the repository path
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Unknown deep links load the app (whose route guard / router then takes over) instead of GitHub's 404 page.
      - run: cp dist/analog/public/index.html dist/analog/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/analog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
